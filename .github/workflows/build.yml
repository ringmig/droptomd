name: Build

# A pushed v* tag builds both apps and puts them in one draft release; the notes are written by hand before publishing.
# Pushes to main build too: a tag run can only restore main's cache, not a PR's, and a cold Windows build is ~45 min.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["windows/**", "tests/**", "main.swift", "icon.swift", "build.sh", "mdconvert.py", ".github/workflows/build.yml"]
  pull_request:
    paths: ["windows/**", "tests/**", "main.swift", "icon.swift", "build.sh", "mdconvert.py", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Build
        run: ./build.sh

      - name: Test
        env:
          LC_ALL: en_US.UTF-8 # so the wildcard below matches å, ä and ö as one character
        run: |
          app=~/Applications/"Drop to MD.app"
          "$app/Contents/Resources/python/bin/python3" tests/test_mdconvert.py
          "$app/Contents/MacOS/DropToMD" tests/fixtures/*
          for f in tests/fixtures/*; do
            # every fixture carries Swedish text; OCR may swap a diacritic, so those letters are wildcards
            grep -qE "R.ksm.rg.s|G.teborg" "${f%.*}.md" || { echo "bad output for $f"; exit 1; }
          done
          echo "all fixtures converted"
          # #2: a dropped .md must stay untouched; the blank lines are what a conversion would collapse
          printf 'a\n\n\n\nb\n' > "$RUNNER_TEMP/keep.md" && cp "$RUNNER_TEMP/keep.md" "$RUNNER_TEMP/keep.orig"
          "$app/Contents/MacOS/DropToMD" "$RUNNER_TEMP/keep.md" | grep -q "File is already markdown" || { echo "wrong message for a dropped .md"; exit 1; }
          cmp "$RUNNER_TEMP/keep.md" "$RUNNER_TEMP/keep.orig" || { echo "a dropped .md was overwritten"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: DropToMD-zip
          path: dist/DropToMD.zip

  windows:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      NUITKA_CACHE_DIR: C:\nuitka-cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - uses: actions/cache/restore@v4
        with:
          path: C:\nuitka-cache
          key: nuitka-${{ hashFiles('windows/requirements.txt') }}-${{ github.run_id }}
          restore-keys: nuitka-${{ hashFiles('windows/requirements.txt') }}-

      - name: Install
        run: python -m pip install -r windows/requirements.txt nuitka[onefile]==4.2.1

      - name: Build
        shell: pwsh
        run: |
          # the exe's version resource takes numbers only, so v1.2.0-rc1 becomes 1.2.0
          $version = if ("${{ github.ref_type }}" -eq "tag") { ("${{ github.ref_name }}".TrimStart("v") -split "-")[0] } else { "0.0.${{ github.run_number }}" }
          $env:PYTHONPATH = $PWD.Path # mdconvert.py sits in the repo root, shared with the Mac app
          python -c "from PIL import Image; Image.open('windows/assets/app.png').save('build-app.ico', sizes=[(16, 16), (24, 24), (32, 32), (48, 48), (256, 256)])"
          python -m nuitka --onefile --assume-yes-for-downloads --enable-plugin=tk-inter `
            --include-package-data=magika `
            --include-package-data=pdfminer `
            --include-package-data=tkinterdnd2 `
            --include-package=winrt `
            --include-package-data=speech_recognition `
            --include-data-dir=windows/assets=assets `
            "--onefile-tempdir-spec={CACHE_DIR}/DropToMD/{VERSION}" `
            "--product-name=Drop to MD" "--product-version=$version" `
            --windows-console-mode=attach --windows-icon-from-ico=build-app.ico `
            --output-dir=build --output-filename=DropToMD.exe windows/droptomd.py

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: C:\nuitka-cache
          key: nuitka-${{ hashFiles('windows/requirements.txt') }}-${{ github.run_id }}

      - name: Test
        shell: pwsh
        run: |
          $exe = (Resolve-Path build/DropToMD.exe).Path
          "exe size: {0:N0} MB" -f ((Get-Item $exe).Length / 1MB)
          foreach ($i in 1, 2) {
            $t = Measure-Command { $p = Start-Process $exe -ArgumentList "--check" -Wait -PassThru -NoNewWindow -RedirectStandardOutput check.txt }
            "check run ${i}: exit $($p.ExitCode), $([int]$t.TotalSeconds) s, $(Get-Content check.txt)"
            if ($p.ExitCode -ne 0) { exit 1 }
          }
          $check = Get-Content check.txt
          $fixtures = Get-ChildItem tests/fixtures -File
          # the runner may lack an OCR language or Word; those fixtures are skipped loudly, never silently
          if ($check -contains "ocr none") { "SKIP png.png, scan.pdf: no OCR language on this machine"; $fixtures = $fixtures | Where-Object { $_.Extension -ne ".png" -and $_.Name -ne "scan.pdf" } }
          if ($check -contains "word no") { "SKIP rtf.rtf: Word is not installed"; $fixtures = $fixtures | Where-Object Extension -ne ".rtf" }
          $p = Start-Process $exe -ArgumentList ($fixtures | ForEach-Object { "`"$($_.FullName)`"" }) -Wait -PassThru -NoNewWindow -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          Get-Content out.txt, err.txt -Encoding utf8
          if ($p.ExitCode -ne 0) { "headless exit $($p.ExitCode)"; exit 1 }
          foreach ($f in $fixtures) {
            $md = [IO.Path]::ChangeExtension($f.FullName, ".md")
            $text = if (Test-Path $md) { Get-Content $md -Raw -Encoding utf8 } else { "" }
            # every fixture carries Swedish text; OCR may swap a diacritic, so those letters are wildcards
            if ($text -notmatch "R.ksm.rg.s|G.teborg") { "bad output for $($f.Name)"; exit 1 }
          }
          "all fixtures converted"
          # #2: a dropped .md must stay untouched; the blank lines are what a conversion would collapse
          Set-Content keep.md "a`n`n`n`nb" -NoNewline
          $before = (Get-FileHash keep.md).Hash
          Start-Process $exe -ArgumentList "`"$((Resolve-Path keep.md).Path)`"" -Wait -NoNewWindow -RedirectStandardOutput keep.txt
          if (-not (Select-String -Path keep.txt -Pattern "File is already markdown" -Quiet)) { "wrong message for a dropped .md"; exit 1 }
          if ((Get-FileHash keep.md).Hash -ne $before) { "a dropped .md was overwritten"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: DropToMD-exe
          path: build/DropToMD.exe

  release:
    if: github.ref_type == 'tag'
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Both builds into one draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 ||
            gh release create "$TAG" --draft --verify-tag --title "Drop to MD ${TAG#v}" --notes "Notes to come."
          gh release upload "$TAG" DropToMD.zip DropToMD.exe --clobber
