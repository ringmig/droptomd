name: Windows exe

on:
  pull_request:
    paths: ["windows/**", "tests/**", ".github/workflows/windows.yml"]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      NUITKA_CACHE_DIR: ${{ runner.temp }}\nuitka-cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\nuitka-cache
          key: nuitka-${{ hashFiles('windows/requirements.txt') }}-${{ github.run_id }}
          restore-keys: nuitka-${{ hashFiles('windows/requirements.txt') }}-

      - name: Install
        run: python -m pip install -r windows/requirements.txt nuitka==4.2.1

      - name: Build
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $version = if ($tag) { $tag.TrimStart("v") } else { "0.0.${{ github.run_number }}" }
          $tkdnd = python -c "import tkinterdnd2, os; print(os.path.join(os.path.dirname(tkinterdnd2.__file__), 'tkdnd', 'win-x64'))"
          python -m nuitka --onefile --assume-yes-for-downloads --enable-plugin=tk-inter `
            --include-package-data=magika `
            "--include-data-files=$tkdnd\*=tkinterdnd2/tkdnd/win-x64/" `
            "--onefile-tempdir-spec={CACHE_DIR}/DropToMD/{VERSION}" `
            "--product-name=Drop to MD" "--product-version=$version" `
            --windows-console-mode=attach `
            --output-dir=build --output-filename=DropToMD.exe windows/droptomd.py

      - name: Test
        shell: pwsh
        run: |
          $exe = (Resolve-Path build/DropToMD.exe).Path
          "exe size: {0:N0} MB" -f ((Get-Item $exe).Length / 1MB)
          foreach ($i in 1, 2) {
            $t = Measure-Command { $p = Start-Process $exe -ArgumentList "--check" -Wait -PassThru -NoNewWindow -RedirectStandardOutput check.txt }
            "check run ${i}: exit $($p.ExitCode), $([int]$t.TotalSeconds) s, $(Get-Content check.txt)"
            if ($p.ExitCode -ne 0) { exit 1 }
          }
          $fixtures = Get-ChildItem tests/fixtures -File
          $p = Start-Process $exe -ArgumentList ($fixtures | ForEach-Object { "`"$($_.FullName)`"" }) -Wait -PassThru -NoNewWindow -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          Get-Content out.txt, err.txt -Encoding utf8
          if ($p.ExitCode -ne 0) { "headless exit $($p.ExitCode)"; exit 1 }
          foreach ($f in $fixtures) {
            $md = [IO.Path]::ChangeExtension($f.FullName, ".md")
            $text = if (Test-Path $md) { Get-Content $md -Raw -Encoding utf8 } else { "" }
            # every fixture carries Swedish text, so this also catches a mangled encoding
            if ($text -notmatch "Räksmörgås|Göteborg") { "bad output for $($f.Name)"; exit 1 }
          }
          "all fixtures converted"

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'release'
        with:
          name: DropToMD-exe
          path: build/DropToMD.exe

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/DropToMD.exe --clobber
